<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10130f">
  <meta name="description" content="A personal website is on its way. Check back soon.">
  <title>Coming Soon — Nick</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #10130f;
      --foreground: #f1f0e9;
      --muted: #a6aa9f;
      --accent: #c5f36a;
      --line: rgba(241, 240, 233, .16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
      color: var(--foreground);
      background:
        radial-gradient(ellipse at 50% 45%, rgba(197, 243, 106, .09), transparent 38%),
        var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
    }
    .page {
      width: min(100%, 980px);
      min-height: min(680px, calc(100vh - 56px));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border: 1px solid var(--line);
      padding: clamp(24px, 5vw, 54px);
      background: rgba(16, 19, 15, .55);
    }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-size: 15px; font-weight: 650; letter-spacing: -.03em; }
    .status { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px rgba(197,243,106,.75); }
    main { max-width: 690px; padding: 72px 0; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 22px 0 24px; font-size: clamp(58px, 11vw, 112px); font-weight: 500; letter-spacing: -.085em; line-height: .91; }
    h1 span { color: var(--accent); }
    .intro { max-width: 470px; margin: 0; color: var(--muted); font-size: clamp(16px, 2vw, 19px); line-height: 1.7; }
    .rule { width: 100%; height: 1px; margin-top: 40px; background: var(--line); }
    footer { color: var(--muted); font-size: 12px; }
    .social { color: var(--foreground); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 4px; }
    .social:hover { color: var(--accent); }
    @media (max-width: 520px) {
      body { padding: 14px; }
      .page { min-height: calc(100vh - 28px); padding: 24px; }
      header { align-items: flex-start; }
      .status { max-width: 118px; line-height: 1.6; text-align: right; }
      footer { align-items: flex-end; }
      main { padding: 58px 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">Nick<span style="color:var(--accent)">.</span></div>
      <div class="status"><span class="dot" aria-hidden="true"></span> Currently in progress</div>
    </header>
    <main>
      <div class="eyebrow">A little patience, please</div>
      <h1>Something<br>good is <span>on its way.</span></h1>
      <p class="intro">I’m putting the finishing touches on my corner of the internet. Come back soon to see what I’ve been working on.</p>
      <div class="rule" aria-hidden="true"></div>
    </main>
    <footer>
      <span>© <span id="year">2026</span> Nick</span>
      <a class="social" href="mailto:hello@example.com">Say hello ↗</a>
    </footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
